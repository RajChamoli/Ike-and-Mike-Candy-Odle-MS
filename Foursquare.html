<head>

    <title>Foursquare comparisons to real soccer players!</title>
  <style>

    body {
            background-color: #000000;
            color: #ffffff; /* Sets text to white for readability */
            font-family: Arial
        }

	.nudge-up {
  	   margin-top: -20px; /* Pulls the text up by 20 pixels */
	}

    
    	 .glow-text {
           font-size: 20px;
           color: #ffffff;
           text-align: center;
           animation: pulse-glow 10s linear infinite; /* Loops seamlessly */
        }

      
          
        @keyframes pulse-glow {
          0%   { text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 30px #ff0000; } /* Red */
          10%  { text-shadow: 0 0 10px #ff7f00, 0 0 20px #ff7f00, 0 0 30px #ff7f00; } /* Orange */
          20%  { text-shadow: 0 0 10px #ffff00, 0 0 20px #ffff00, 0 0 30px #ffff00; } /* Yellow */
          30%  { text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00, 0 0 30px #00ff00; } /* Green */
          40%  { text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff; } /* Cyan */
          50%  { text-shadow: 0 0 10px #0000ff, 0 0 20px #0000ff, 0 0 30px #0000ff; } /* Blue */
          60%  { text-shadow: 0 0 10px #7f00ff, 0 0 20px #7f00ff, 0 0 30px #7f00ff; } /* Purple */
          70%  { text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 30px #ff00ff; } /* Magenta */
          80%  { text-shadow: 0 0 10px #808080, 0 0 20px #808080, 0 0 30px #808080; } /* Grey */
          90%  { text-shadow: 0 0 10px #000000, 0 0 20px #000000, 0 0 30px #000000; } /* Black */
          100% { text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 30px #ff0000; } /* Back to Red */
        }
  </style>
</head>
<body>
